      const [selectedStudentIds, setSelectedStudentIds] = useState([]);
      const [currentSlide, setCurrentSlide] = useState(0);

      // Filters State (Prompt 6)
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedRisk, setSelectedRisk] = useState('All');
      const [selectedDept, setSelectedDept] = useState('All');
      const [selectedYear, setSelectedYear] = useState('All');
      const [selectedIntervention, setSelectedIntervention] = useState('All');
      const [sortBy, setSortBy] = useState('risk-desc');

      const triggerAction = (actionTitle, studentName) => {
        setActionToast(`Action Executed: "${actionTitle}" for ${studentName}`);
        setTimeout(() => setActionToast(null), 3500);
      };

      const handleSelectAll = (e) => {
        if (e.target.checked) {
          setSelectedStudentIds(filteredStudents.map(s => s.id));
        } else {
          setSelectedStudentIds([]);
        }
      };

      const toggleSelectStudent = (id) => {
        setSelectedStudentIds(prev =>
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const handleBatchCounseling = () => {
        setActionToast(`Priority Counseling Scheduled for ${selectedStudentIds.length} Selected Students`);
        setSelectedStudentIds([]);
        setTimeout(() => setActionToast(null), 4000);
      };

      const handleBatchAdvisories = () => {
        setActionToast(`Dean Risk Advisories Dispatched to Parents & Mentors of ${selectedStudentIds.length} Students`);
        setSelectedStudentIds([]);
        setTimeout(() => setActionToast(null), 4000);
      };

      const handleExportCSV = () => {
        const selected = mockStudents.filter(s => selectedStudentIds.includes(s.id));
        const studentsToExport = selected.length > 0 ? selected : filteredStudents;
        
        const headers = ["ID", "Name", "Roll No", "Major", "Year", "Risk Score", "Risk Tier", "CGPA", "Attendance Rate", "Intervention Track"];
        const rows = studentsToExport.map(s => [
          s.id,
          `"${s.name}"`,
          s.rollNo,
          `"${s.major}"`,
          `"${s.year}"`,
          `${s.riskScore}%`,
          s.riskLevel,
          s.cgpa,
          `${s.attendanceRate}%`,
          `"${s.interventionCategory}"`
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `kpmg_student_risk_manifest_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setActionToast(`Exported CSV Report for ${studentsToExport.length} Students`);
        setTimeout(() => setActionToast(null), 4000);
      };

      const filteredStudents = useMemo(() => {
        return mockStudents
          .filter(student => {
            const matchesSearch =
              student.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
              student.rollNo.toLowerCase().includes(searchTerm.toLowerCase()) ||
              student.major.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesRisk = selectedRisk === 'All' || student.riskLevel === selectedRisk;
            const matchesDept = selectedDept === 'All' || student.major === selectedDept;
            const matchesYear = selectedYear === 'All' || student.year === selectedYear;
            const matchesIntervention = selectedIntervention === 'All' || student.interventionCategory === selectedIntervention;
            return matchesSearch && matchesRisk && matchesDept && matchesYear && matchesIntervention;
          })
          .sort((a, b) => {

                      <div className="flex items-center gap-2.5">
                        <h3 className="text-xl font-bold">{activeModalStudent.name}</h3>
                        <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full border ${
                          activeModalStudent.riskLevel === 'High' ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' : activeModalStudent.riskLevel === 'Medium' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
                        }`}>
                          {activeModalStudent.riskLevel} Risk Tier
                        </span>
                      </div>
                      <p className="text-xs text-slate-300 mt-1">
                        {activeModalStudent.rollNo} • {activeModalStudent.major} • {activeModalStudent.year} (Semester {activeModalStudent.semester})
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={() => setActiveModalStudent(null)}
                    className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Body */}
                <div className="p-6 space-y-5 max-h-[75vh] overflow-y-auto">
                  {/* 5 Core Metrics (Prompt 2) */}
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                      <span className="text-[10px] font-bold uppercase text-slate-400">Risk Score</span>
                      <p className={`text-lg font-black mt-1 font-mono ${activeModalStudent.riskLevel === 'High' ? 'text-rose-600' : activeModalStudent.riskLevel === 'Medium' ? 'text-amber-600' : 'text-emerald-600'}`}>
                        {activeModalStudent.riskScore}%
                      </p>
                      <span className="text-[10px] text-slate-400">Score: {activeModalStudent.successScore}/100</span>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                      <span className="text-[10px] font-bold uppercase text-slate-400">Attendance</span>
                      <p className={`text-lg font-black mt-1 font-mono ${activeModalStudent.attendanceRate < 65 ? 'text-rose-600' : 'text-slate-900'}`}>
                        {activeModalStudent.attendanceRate}%
                      </p>
                      <span className="text-[10px] text-slate-400">Target &ge; 75%</span>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                      <span className="text-[10px] font-bold uppercase text-slate-400">CGPA</span>
                      <p className="text-lg font-black mt-1 font-mono text-slate-900">{activeModalStudent.cgpa}</p>
                      <span className="text-[10px] text-slate-400">Scale / 10.0</span>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center">
                      <span className="text-[10px] font-bold uppercase text-slate-400">Assignments</span>
                      <p className="text-lg font-black mt-1 font-mono text-slate-900">{activeModalStudent.assignmentCompletionRate}%</p>
                      <span className="text-[10px] text-slate-400">LMS Completed</span>
                    </div>

                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-center col-span-2 sm:col-span-1">
                      <span className="text-[10px] font-bold uppercase text-slate-400">Engagement</span>
                      <p className="text-lg font-black mt-1 font-mono text-slate-900">{activeModalStudent.engagementScore}/100</p>
                      <span className="text-[10px] text-slate-400">Portal Index</span>
                    </div>
                  </div>

                  {/* Why Flagged (Prompt 3) */}
                  <div className="p-4 bg-indigo-50/70 rounded-2xl border border-indigo-200/80">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-900 block mb-1">
                      Why was this student flagged? (Explainable AI Engine)
                    </span>
                    <p className="text-xs text-indigo-950 font-medium leading-relaxed">
                      {activeModalStudent.whyFlagged}
                    </p>
                  </div>

                  {/* Risk Factors & Drivers */}
                  <div className="space-y-2">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">
                      Score Attributions (SHAP Positive vs Risk Penalties)
                    </span>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {activeModalStudent.positiveDrivers.map((item, idx) => (
                        <div key={`modal-pos-${idx}`} className="p-2.5 bg-emerald-50 rounded-xl border border-emerald-200 text-xs flex justify-between">
                          <div>
                            <p className="font-bold text-emerald-950">{item.factor}</p>
                            <p className="text-[10px] text-emerald-800">{item.description}</p>
                          </div>
                          <span className="font-black text-emerald-700 font-mono">{item.impact}</span>
                        </div>
                      ))}
                      {activeModalStudent.riskDrivers.map((item, idx) => (
                        <div key={`modal-risk-${idx}`} className="p-2.5 bg-rose-50 rounded-xl border border-rose-200 text-xs flex justify-between">
                          <div>
                            <p className="font-bold text-rose-950">{item.factor}</p>
                            <p className="text-[10px] text-rose-800">{item.description}</p>
                          </div>
                          <span className="font-black text-rose-700 font-mono">{item.impact}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Recommended Interventions (Prompt 5) */}
                  <div className="space-y-2 pt-2 border-t border-slate-100">
                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-600 block">
                      Recommended Interventions ({activeModalStudent.interventionCategory})
                    </span>
                    {activeModalStudent.recommendedInterventions.map((item) => (
                      <div key={item.id} className="p-3 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between text-xs">
                        <div>
                          <p className="font-bold text-slate-900">{item.title}</p>
                          <p className="text-[11px] text-slate-500">Priority: <strong>{item.urgency}</strong> • Status: {item.status}</p>
                        </div>
                        <button
                          onClick={() => triggerAction(item.action, activeModalStudent.name)}
                          className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-sm"
                        >
                          {item.action}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                  <button
                    onClick={() => setActiveModalStudent(null)}
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-900"
                  >
                    Close
                  </button>
                  <button
                    onClick={() => {
                      setSelectedStudentId(activeModalStudent.id);
                      setActiveModalStudent(null);
                      setCurrentRoute('profile');
                    }}
                    className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold"
                  >
                    Open Full Radar &amp; AI Diagnostic Page →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* OFFICIAL DEAN INTERVENTION BRIEF MODAL (PRINT-READY) */}
          {showReportModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl border border-slate-300 shadow-2xl w-full max-w-2xl overflow-hidden my-8 p-8 space-y-6">
                <div className="flex items-start justify-between border-b border-slate-200 pb-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-lg font-black text-blue-900">KPMG</span>
                      <span className="text-xs uppercase tracking-wider font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded">
                        India
                      </span>
                    </div>
                    <h3 className="text-lg font-bold text-slate-900 mt-1">
                      Official Student Diagnostic &amp; Intervention Brief
                    </h3>
                    <p className="text-xs text-slate-500">
                      Document Reference: KPMG-SCA-{selectedStudent.id}-{new Date().getFullYear()}
                    </p>
                  </div>
                  <button
                    onClick={() => setShowReportModal(false)}
                    className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-4 text-xs bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[10px]">Student Name</p>
                    <p className="text-slate-900 font-bold text-sm">{selectedStudent.name}</p>
                    <p className="text-slate-500 font-mono mt-0.5">Roll: {selectedStudent.rollNo}</p>
                  </div>
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[10px]">Program &amp; Department</p>
                    <p className="text-slate-900 font-bold text-sm">{selectedStudent.major}</p>
                    <p className="text-slate-500 mt-0.5">{selectedStudent.year} (Sem {selectedStudent.semester})</p>
                  </div>
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[10px]">Current Risk Level</p>
                    <p className="text-rose-600 font-extrabold text-sm">{selectedStudent.riskScore}% ({selectedStudent.riskLevel} Tier)</p>
                  </div>
                  <div>
                    <p className="text-slate-400 font-bold uppercase text-[10px]">Intervention Track</p>
                    <p className="text-slate-900 font-bold text-sm">{selectedStudent.interventionCategory}</p>
                  </div>
                </div>

                <div className="space-y-2 text-xs">
                  <p className="font-bold uppercase tracking-wider text-slate-500 text-[10px]">
                    AI Diagnostic Summary &amp; Cause of Flagging:
                  </p>
                  <p className="p-3 bg-slate-50 border border-slate-200 rounded-xl leading-relaxed text-slate-700">
                    {selectedStudent.whyFlagged}
                  </p>
                </div>

                <div className="space-y-2 text-xs">
                  <p className="font-bold uppercase tracking-wider text-slate-500 text-[10px]">
                    Authorized Action Items Dispatched:
                  </p>
                  <ul className="list-disc pl-5 space-y-1 text-slate-700">
                    {selectedStudent.recommendedInterventions.map(item => (
                      <li key={item.id}>
                        <strong>{item.title}</strong> &mdash; Priority: {item.urgency} ({item.status})
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="pt-4 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
                  <div>
                    <p className="font-bold text-slate-800">Dr. V. Reddy</p>
                    <p className="text-[10px]">Dean of Academics &amp; Student Affairs</p>
                  </div>
                  <button
                    onClick={() => { window.print(); setShowReportModal(false); }}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-colors"
                  >
                    🖨️ Print Document
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
